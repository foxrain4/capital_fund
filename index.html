<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capital Fund Manager</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .section {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    .undo-btn {
      background-color: crimson;
    }
  </style>
</head>
<body>

  <h1>Capital Fund Manager</h1>

  <!-- 1. Current Bank -->
  <div class="section">
    <h2>💰 Current Balance: $<span id="balance">0.00</span></h2>
    <input type="number" id="amount" placeholder="Enter amount..." />
    <button onclick="addMoney()">Add</button>
    <button onclick="deductMoney()">Deduct</button>
    <button onclick="undoLastAction()" class="undo-btn">Undo Last Action</button>
  </div>

  <script>
    let balance = 0;
    let actionHistory = []; // Keeps track of actions for undo

    // Load the saved data from localStorage
    function loadData() {
      balance = parseFloat(localStorage.getItem("capitalBalance")) || 0;
      actionHistory = JSON.parse(localStorage.getItem("capitalActionHistory")) || [];
      document.getElementById("balance").textContent = balance.toFixed(2);
    }

    // Save the current data to localStorage
    function saveData() {
      localStorage.setItem("capitalBalance", balance.toString());
      localStorage.setItem("capitalActionHistory", JSON.stringify(actionHistory));
    }

    // Add funds to the balance
    function addMoney() {
      const amt = parseFloat(document.getElementById("amount").value);
      if (!isNaN(amt)) {
        balance += amt;
        actionHistory.push({ type: 'add', amount: amt, balance: balance.toFixed(2) });
        updateAll();
      }
    }

    // Deduct funds from the balance
    function deductMoney() {
      const amt = parseFloat(document.getElementById("amount").value);
      if (!isNaN(amt)) {
        balance -= amt;
        actionHistory.push({ type: 'deduct', amount: amt, balance: balance.toFixed(2) });
        updateAll();
      }
    }

    // Undo the last action
    function undoLastAction() {
      if (actionHistory.length > 0) {
        const lastAction = actionHistory.pop();
        if (lastAction.type === 'add') {
          balance -= lastAction.amount;
        } else if (lastAction.type === 'deduct') {
          balance += lastAction.amount;
        }
        updateAll();
      }
    }

    // Update the UI and save data
    function updateAll() {
      document.getElementById("balance").textContent = balance.toFixed(2);
      saveData();
    }

    // Initialize data when page loads
    loadData();
  </script>

</body>
</html>
